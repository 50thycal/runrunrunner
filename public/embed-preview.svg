<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Ceiling lane -->
  <rect x="0" y="100" width="1200" height="4" fill="#4a4a6a"/>

  <!-- Floor lane -->
  <rect x="0" y="526" width="1200" height="4" fill="#4a4a6a"/>

  <!-- Player character on floor -->
  <g transform="translate(200, 420)">
    <!-- Body -->
    <rect width="75" height="100" fill="#3498db" rx="3"/>
    <!-- Eye -->
    <rect x="54" y="20" width="15" height="15" fill="#2980b9" rx="2"/>
    <!-- Mouth -->
    <rect x="54" y="50" width="15" height="10" fill="#2980b9" rx="2"/>
    <!-- Left leg -->
    <rect x="12" y="100" width="20" height="20" fill="#2980b9"/>
    <!-- Right leg -->
    <rect x="42" y="100" width="20" height="20" fill="#2980b9"/>
  </g>

  <!-- Red obstacle on floor -->
  <g transform="translate(550, 401)">
    <rect y="25" width="75" height="125" fill="#e74c3c"/>
    <!-- Spike top -->
    <polygon points="0,25 37.5,0 75,25" fill="#e74c3c"/>
  </g>

  <!-- Red obstacle on ceiling -->
  <g transform="translate(800, 104)">
    <rect width="75" height="125" fill="#e74c3c"/>
    <!-- Spike bottom -->
    <polygon points="0,125 37.5,150 75,125" fill="#e74c3c"/>
  </g>

  <!-- Title text -->
  <text x="600" y="320" text-anchor="middle" font-family="monospace" font-size="64" font-weight="bold" fill="#ffffff">runrunrunner</text>
  <text x="600" y="370" text-anchor="middle" font-family="monospace" font-size="24" fill="#8b5cf6">Flip to survive. Win ETH daily.</text>
</svg>
