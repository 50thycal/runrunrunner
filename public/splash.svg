<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a2e"/>

  <!-- Player character centered -->
  <g transform="translate(70, 50)">
    <!-- Body -->
    <rect width="60" height="80" fill="#3498db" rx="3"/>
    <!-- Eye -->
    <rect x="43" y="16" width="12" height="12" fill="#2980b9" rx="2"/>
    <!-- Mouth -->
    <rect x="43" y="40" width="12" height="8" fill="#2980b9" rx="1"/>
    <!-- Left leg -->
    <rect x="10" y="80" width="16" height="16" fill="#2980b9"/>
    <!-- Right leg -->
    <rect x="34" y="80" width="16" height="16" fill="#2980b9"/>
  </g>
</svg>
